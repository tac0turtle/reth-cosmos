[package]
name = "cosmos-auth"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
alloy-primitives = { version = "=1.6.1", features = ["rlp", "serde"] }
alloy-rlp = "0.3"
alloy-serde = "=2.3.0"
base64 = "0.22"
bech32 = "0.9"
k256 = { version = "0.13", features = ["ecdsa"] }
ripemd = "0.1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
