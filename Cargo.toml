[package]
name = "reth-cosmos-dev"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
alloy-consensus = { version = "=2.3.0", features = ["k256", "serde"] }
alloy-eips = "=2.3.0"
alloy-evm = "=0.38.0"
alloy-network = "=2.3.0"
alloy-primitives = "=1.6.1"
alloy-rlp = "0.3"
alloy-rpc-types-engine = "=2.3.0"
alloy-rpc-types-eth = "=2.3.0"
clap = { version = "4.5", features = ["derive"] }
cosmos-auth = { path = "crates/cosmos-auth" }
eyre = "0.6"
jsonrpsee = { version = "0.26", features = ["server"] }
reth-basic-payload-builder = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-codecs = "=0.6.0"
reth-consensus = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-consensus-common = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-engine-local = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-engine-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-errors = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2", features = ["node", "cli", "consensus"] }
reth-ethereum-consensus = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-ethereum-engine-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-ethereum-payload-builder = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-evm = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-execution-cache = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-execution-types = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-node-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-node-builder = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-payload-builder = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-payload-builder-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-payload-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-primitives-traits = { version = "=0.6.0", features = ["reth-codec"] }
reth-provider = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-revm = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-rpc = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-rpc-convert = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-rpc-eth-types = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-storage-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-storage-errors = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-transaction-pool = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
revm = "=42.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
alloy-genesis = "=2.3.0"
k256 = { version = "0.13", features = ["ecdsa"] }

[profile.dev]
debug = 0

[profile.dev.package.reth-cosmos-dev]
opt-level = 1

[profile.test]
debug = 0

[workspace]
members = ["crates/cosmos-auth"]
